services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Inside Compose, "redis" is the Redis service DNS name. localhost would
      # point back to this application container.
      REDIS_URL: redis://redis:6379/0
      LLM_CACHE_ENABLED: "true"
      METRICS_ENABLED: "true"
      METRICS_PATH: /metrics
      RAG_MILVUS_URI: /app/vector_db/milvus_rag.db
      VECTOR_DB_PATH: /app/vector_db
      DATA_DIR: /app/data
      HF_HOME: /app/.cache/huggingface
      # Xet large-file transport can stall on some Windows/China networks.
      # Standard HTTP is slower in ideal conditions but more reliable here.
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./vector_db:/app/vector_db
      - huggingface-cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 30s
      timeout: 10s
      # 首次启动要下载 bge-m3（约 2.2GB），给足启动时间
      start_period: 900s
      retries: 5

  # 可选：Open WebUI 聊天前端，通过 /v1 OpenAI 兼容接口接入本服务。
  # 启动：docker compose --profile ui up -d    打开 http://127.0.0.1:3000
  webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://app:8000/v1
      # 与 .env 里的 API_TOKEN 一致（Compose 会自动读取项目根目录 .env 做变量替换）
      OPENAI_API_KEY: ${API_TOKEN:-not-set}
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  redis-data:
  huggingface-cache:
  open-webui:
